name: "SVH Graph Ablation (search: alpha sweep, TQ4)"

datasets:
  - name: arguana
    path: data/beir/arguana
    index_dir: results/svh_graph_ablation/indices/arguana
    results_dir: experiments/svh_graph_ablation/results/arguana
  - name: fiqa
    path: data/beir/fiqa
    index_dir: results/svh_graph_ablation/indices/fiqa
    results_dir: experiments/svh_graph_ablation/results/fiqa
  - name: hotpotqa
    path: data/beir/hotpotqa
    index_dir: results/svh_graph_ablation/indices/hotpotqa
    results_dir: experiments/svh_graph_ablation/results/hotpotqa
  - name: nfcorpus
    path: data/beir/nfcorpus
    index_dir: results/svh_graph_ablation/indices/nfcorpus
    results_dir: experiments/svh_graph_ablation/results/nfcorpus
  - name: nq
    path: data/beir/nq
    index_dir: results/svh_graph_ablation/indices/nq
    results_dir: experiments/svh_graph_ablation/results/nq
  - name: nq500k
    path: data/beir/nq500k
    index_dir: results/svh_graph_ablation/indices/nq500k
    results_dir: experiments/svh_graph_ablation/results/nq500k
  - name: quora
    path: data/beir/quora
    index_dir: results/svh_graph_ablation/indices/quora
    results_dir: experiments/svh_graph_ablation/results/quora
  - name: scidocs
    path: data/beir/scidocs
    index_dir: results/svh_graph_ablation/indices/scidocs
    results_dir: experiments/svh_graph_ablation/results/scidocs
  - name: scifact
    path: data/beir/scifact
    index_dir: results/svh_graph_ablation/indices/scifact
    results_dir: experiments/svh_graph_ablation/results/scifact

indices:
  - name: svh_graph
    metric: ip
    builds:
      - build_name: svh_graph_R64_a1.0
        build_params: &svh_graph_defaults
          R: 64
          L: 128
          alpha: 1.0
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs: &svh_graph_k10
          - name: k=10
            params:
              tq8_rerank: [true]
              L: [64, 128, 256, 512, 1024, 2048, 4096]
              k: [10]
              config:
                - { name: nr1000,   num_rerank: 1000 }
                - { name: nr5000,  num_rerank: 5000 }
                - { name: nr10000, num_rerank: 10000 }
      - build_name: svh_graph_R64_a0.95
        build_params: { <<: *svh_graph_defaults, alpha: 0.95 }
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs: *svh_graph_k10
      - build_name: svh_graph_R64_a0.9
        build_params: { <<: *svh_graph_defaults, alpha: 0.9 }
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs: *svh_graph_k10