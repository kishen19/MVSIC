name: "Overretrieve Single-Vector Benchmark — datasets"

# Default location of the single-vector data tree on disk. By convention each
# dataset is expected at:
#   <data_root>/<name>/<name>_base.fbin
#   <data_root>/<name>/<name>_query.fbin
#   <data_root>/<name>/<name>_groundtruth        (optional)
# Datasets whose files don't follow this convention specify points/queries
# explicitly below.
#
# Override at runtime with the DATA_ROOT environment variable or the
# --data-root flag of run_benchmark.sh.
data_root: /mnt/ann_data/data

# Defaults applied to every dataset (can be overridden per-dataset).
# Only values set here (or per-dataset) are forwarded to the binary; unset
# tunables fall back to the binary's own defaults.
defaults:
  k: 10           # Recall@k that the binary reports for each k' in its grid.
  k_growth: 1.1   # geometric-progression rate for the k' schedule
  max_k_prime: 1000  # upper bound on k'; caps the heap size + sweep cost
  # pq_method: All        # TQ4|TurboQuant|TQ8|FastScan|1BTQ|RabitQ|RabitQ1|RabitQ4|RabitQ8|All
  # rabitq_bits: 8        # only used when pq_method=RabitQ (the configurable variant)
  # fs_block: 8           # FastScan block size; must divide the dataset's dim
  # num_query: 1000       # cap queries (omitted = use all)

# Per-dataset keys (all optional): metric, k, points, queries, gt,
# pq_method, rabitq_bits, fs_block, num_query, max_k_prime, k_growth, extra_args.
# When points/queries/gt are omitted, the conventional <name>/<name>_*.fbin
# layout under data_root is used. `gt` is omitted everywhere here so the binary
# computes exact k-NN once via blocked Eigen GEMM and caches it under /tmp.
#
# Slice policy: each dataset uses the largest <name>-<count> slice with
# count <= 10,000,000.
datasets:
  # ---- L2 ----
  - name: OpenAIArXiv
    metric: L2
    points:  OpenAIArXiv/openai-2000000
    queries: OpenAIArXiv/query

  - name: deep
    metric: L2
    points:  deep/deep-10000000
    queries: deep/query

  - name: msturing
    metric: L2
    points:  msturing/msturing-10000000
    queries: msturing/query

  # ---- IP / MIPS ----
  # Convention-matching layout (glove-100-angular_{base,query}.fbin etc.).
  - name: glove-100-angular
    metric: IP

  # Non-conventional layout: bare base.fbin / query.fbin / groundtruth.
  - name: nytimes-256-angular
    metric: IP
    points:  nytimes-256-angular/base.fbin
    queries: nytimes-256-angular/query.fbin

  - name: text2image
    metric: IP
    points:  text2image/text2image-10000000
    queries: text2image/query

  - name: wikipedia_cohere
    metric: IP
    points:  wikipedia_cohere/wikipedia_cohere-1000000
    queries: wikipedia_cohere/query

  # ---- Chamfer (BEIR) datasets, exploded into single vectors via -pcs ----
  # The .pcs format encodes per-document point clouds; -pcs tells the binary
  # to flatten the per-cloud structure and treat every individual embedding
  # as its own base/query vector. All MIPS (IP). Absolute paths since these
  # live outside data_root.
  - name: chamfer_arguana
    metric: IP
    points:  /mnt/ann_data/chamfer_data/beir/arguana/arguana_points.pcs
    queries: /mnt/ann_data/chamfer_data/beir/arguana/arguana_queries.pcs
    extra_args: ["-pcs"]

  - name: chamfer_fiqa
    metric: IP
    points:  /mnt/ann_data/chamfer_data/beir/fiqa/fiqa_points.pcs
    queries: /mnt/ann_data/chamfer_data/beir/fiqa/fiqa_queries.pcs
    extra_args: ["-pcs"]

  - name: chamfer_hotpotqa
    metric: IP
    points:  /mnt/ann_data/chamfer_data/beir/hotpotqa/hotpotqa_points.pcs
    queries: /mnt/ann_data/chamfer_data/beir/hotpotqa/hotpotqa_queries.pcs
    extra_args: ["-pcs"]

  - name: chamfer_nfcorpus
    metric: IP
    points:  /mnt/ann_data/chamfer_data/beir/nfcorpus/nfcorpus_points.pcs
    queries: /mnt/ann_data/chamfer_data/beir/nfcorpus/nfcorpus_queries.pcs
    extra_args: ["-pcs"]

  - name: chamfer_nq
    metric: IP
    points:  /mnt/ann_data/chamfer_data/beir/nq/nq_points.pcs
    queries: /mnt/ann_data/chamfer_data/beir/nq/nq_queries.pcs
    extra_args: ["-pcs"]

  - name: chamfer_nq500k
    metric: IP
    points:  /mnt/ann_data/chamfer_data/beir/nq500k/nq500k_points.pcs
    queries: /mnt/ann_data/chamfer_data/beir/nq500k/nq500k_queries.pcs
    extra_args: ["-pcs"]

  - name: chamfer_quora
    metric: IP
    points:  /mnt/ann_data/chamfer_data/beir/quora/quora_points.pcs
    queries: /mnt/ann_data/chamfer_data/beir/quora/quora_queries.pcs
    extra_args: ["-pcs"]

  - name: chamfer_scidocs
    metric: IP
    points:  /mnt/ann_data/chamfer_data/beir/scidocs/scidocs_points.pcs
    queries: /mnt/ann_data/chamfer_data/beir/scidocs/scidocs_queries.pcs
    extra_args: ["-pcs"]

  - name: chamfer_scifact
    metric: IP
    points:  /mnt/ann_data/chamfer_data/beir/scifact/scifact_points.pcs
    queries: /mnt/ann_data/chamfer_data/beir/scifact/scifact_queries.pcs
    extra_args: ["-pcs"]
