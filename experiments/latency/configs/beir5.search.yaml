name: "Main experiments latency (BEIR5)"

datasets:
  - name: nfcorpus
    path: data/beir/nfcorpus
    index_dir:   results/indexes/nfcorpus
    results_dir: experiments/latency/results/nfcorpus
  - name: scifact
    path: data/beir/scifact
    index_dir:   results/indexes/scifact
    results_dir: experiments/latency/results/scifact
  - name: arguana
    path: data/beir/arguana
    index_dir:   results/indexes/arguana
    results_dir: experiments/latency/results/arguana
  - name: scidocs
    path: data/beir/scidocs
    index_dir:   results/indexes/scidocs
    results_dir: experiments/latency/results/scidocs
  - name: fiqa
    path: data/beir/fiqa
    index_dir:   results/indexes/fiqa
    results_dir: experiments/latency/results/fiqa

# Notation for variants/quantizers:
#   quantizer = "TQ"         -> 4-bit TurboQuant (greedy + leaf scoring path)
#   quantizer = "OneBitTQ"   -> 1-bit TurboQuant (leaf-probing variant)
#   quantizer = "EightBitTQ" -> 8-bit TurboQuant (used for build / reranking)
# Reranking is configured via SearchParams.num_rerank in each search_config.

indices:
  # -------------------- MVIVF --------------------
  # Greedy: TQ4bit, Leaf probing: TQ1bit (variant), Rerank: TQ8bit (num_rerank>0).
  - name: mvivf
    metric: ip
    builds:
      - build_name: mvivf_k0_l100_d0_nit5_s0_mpcc100
        build_params: &mvivf_build
          k_per_level: 0
          max_leaf_size: 100
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
        variants:
          - { name: tq1, compress: true, quantizer: OneBitTQ }   # 1-bit leaf probing
        search_configs:
          - name: k=10
            params:
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
              k: [10]
              config:
                - { name: nr0,    num_rerank: 0 }
                - { name: nr20,   num_rerank: 20 }
                - { name: nr40,  num_rerank: 40 }

  # -------------------- MUVERA --------------------
  # Build: None. Search: Vamana w/ TQ4bit. Rerank: TQ8bit via num_rerank.
  - name: muvera
    metric: ip
    builds:
      - build_name: muvera_2560_R200_L600
        build_params:
          d_fde: 2560
          R: 200
          L: 600
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs:
          - name: k=10
            params:
              L: [16, 32, 64, 128, 256, 512, 1024, 2048]
              k: [10]
              config:
                - { name: nr10,   num_rerank: 10, norerank: True }
                - { name: nr50,   num_rerank: 50 }
                - { name: nr500,  num_rerank: 500 }
                - { name: nr5000, num_rerank: 5000 }

  # -------------------- MV-Vamana --------------------
  - name: vamana
    metric: ip
    builds:
      - build_name: vamana_R200
        build_params:
          R: 200
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs:
          - name: k=10
            params:
              L: [16, 32, 64, 128, 256, 512, 1024, 2048]
              k: [10]
              config:
                - { name: nr0,    num_rerank: 0 }
                - { name: nr50,   num_rerank: 50 }
                - { name: nr500,  num_rerank: 500 }

  # -------------------- SVH Graph --------------------
  - name: svh_graph
    metric: ip
    builds:
      - build_name: svh_graph_R200
        build_params:
          R: 200
          L: 600
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs:
          - name: k=10
            params:
              L: [16, 32, 64, 128, 256, 512, 1024, 2048]
              k: [10]
              config:
                - { name: nr0,    num_rerank: 0 }
                - { name: nr50,   num_rerank: 50 }
                - { name: nr500,  num_rerank: 500 }

  # -------------------- FastPlaid (BEIR5 only) --------------------
  - name: fastplaid
    metric: ip
    builds:
      - build_name: fastplaid_nbits4
        build_params:
          nbits: 4
        search_configs:
          - name: k=10
            params:
              n_ivf_probe: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
              k: [10]
              config:
                - { name: nr64,  num_rerank: 64 }
                - { name: nr256, num_rerank: 256 }
