name: "Main experiments latency (BEIR-5: nfcorpus, scifact, arguana, scidocs, fiqa)"

# `is_mmap: true` mmaps the points (database) PCS file at load time. Queries
# are loaded normally. Match the build config so we don't double-RAM the data.
#
# These five BEIR-5 corpora share one set of search params; for the larger
# BEIR shards (nq, hotpotqa, quora) see beirbig.search.yaml, and for nq500k
# see nq500k.search.yaml.

datasets:
  - { name: nfcorpus, path: data/beir/nfcorpus, index_dir: results/indexes/nfcorpus, results_dir: experiments/latency/results/nfcorpus, is_mmap: true }
  - { name: scifact,  path: data/beir/scifact,  index_dir: results/indexes/scifact,  results_dir: experiments/latency/results/scifact,  is_mmap: true }
  - { name: arguana,  path: data/beir/arguana,  index_dir: results/indexes/arguana,  results_dir: experiments/latency/results/arguana,  is_mmap: true }
  - { name: scidocs,  path: data/beir/scidocs,  index_dir: results/indexes/scidocs,  results_dir: experiments/latency/results/scidocs,  is_mmap: true }
  - { name: fiqa,     path: data/beir/fiqa,     index_dir: results/indexes/fiqa,     results_dir: experiments/latency/results/fiqa,     is_mmap: true }

# Notation for variants/quantizers:
#   quantizer = "TQ"         -> 4-bit TurboQuant (greedy + leaf scoring path)
#   quantizer = "OneBitTQ"   -> 1-bit TurboQuant (leaf-probing variant)
#   quantizer = "EightBitTQ" -> 8-bit TurboQuant (used for build / reranking)
# Reranking is configured via SearchParams.num_rerank in each search_config;
# `tq8_rerank: true` makes the rerank step use 8-bit TurboQuant.

indices:
  # -------------------- MVIVF --------------------
  - name: mvivf
    metric: ip
    builds:
      - build_name: mvivf_k0_l100_d0_nit5_s0_mpcc100
        build_params:
          k_per_level: 0
          max_leaf_size: 100
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          build_with_8btq: true
        variants:
          - { name: tq1, compress: true, quantizer: OneBitTQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              query_compression: ["Wards"]
              query_compression_threshold: [0.5]
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
              k: [10]
              config:
                - { name: nr20,   num_rerank: 20 }
                - { name: nr50,   num_rerank: 50 }
                - { name: nr100,   num_rerank: 100 }
                - { name: nr500,   num_rerank: 500 }

          - name: k=100
            params:
              tq8_rerank: [true]
              query_compression: ["Wards"]
              query_compression_threshold: [0.5]
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]
              k: [100]
              config:
                - { name: nr200,   num_rerank: 200 }
                - { name: nr500,   num_rerank: 500 }
                - { name: nr1000,   num_rerank: 1000 }
                - { name: nr5000,   num_rerank: 5000 }

  # -------------------- MVIVF Spill --------------------
  - name: mvivf_spill
    metric: ip
    builds:
      - build_name: mvivf_k0_l100_d0_nit5_s0_mpcc100_spill_2_1
        build_params:
          k_per_level: 0
          max_leaf_size: 100
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          build_with_8btq: true
          num_spill: 2
          num_spill_l2: 1
        variants:
          - { name: tq1, compress: true, quantizer: OneBitTQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              query_compression: ["Wards"]
              query_compression_threshold: [0.5]
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
              k: [10]
              config:
                - { name: nr20,   num_rerank: 20 }
                - { name: nr50,   num_rerank: 50 }
                - { name: nr100,  num_rerank: 100 }
                - { name: nr500,  num_rerank: 500 }

  # -------------------- MUVERA --------------------
  - name: muvera
    metric: ip
    builds:
      - build_name: muvera_10240_R200_L600_a1.0
        build_params:
          d_fde: 10240
          R: 200
          L: 600
          alpha: 1.0
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs:
          - name: k=10
            # On nfcorpus / scifact / fiqa muvera tops out around recall ~0.94
            # at L=4096 with QPS still 38-85. Extra L steps + larger num_rerank
            # buckets push recall closer to vamana / mvivf. The QPS=10 floor
            # set by --QPS_thresh in benchmark_search.py will trim the long
            # tail per shard automatically.
            params:
              tq8_rerank: [true]
              L: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]
              k: [10]
              config:
                - { name: nr500,   num_rerank: 500 }
                - { name: nr1000,  num_rerank: 1000 }
                - { name: nr5000,  num_rerank: 5000 }
          - name: k=100
            # On nfcorpus / scifact / fiqa muvera tops out around recall ~0.94
            # at L=4096 with QPS still 38-85. Extra L steps + larger num_rerank
            # buckets push recall closer to vamana / mvivf. The QPS=10 floor
            # set by --QPS_thresh in benchmark_search.py will trim the long
            # tail per shard automatically.
            params:
              tq8_rerank: [true]
              L: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768]
              k: [100]
              config:
                - { name: nr5000,   num_rerank: 5000 }
                - { name: nr10000,  num_rerank: 10000 }

  # -------------------- MV-Vamana --------------------
  - name: vamana
    metric: ip
    builds:
      - build_name: vamana_R64_L128_a1.0
        build_params:
          R: 64
          L: 128
          alpha: 1.0
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              L: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
              k: [10]
              config:
                - { name: nr20, num_rerank: 20 }
                - { name: nr50, num_rerank: 50 }
          - name: k=100
            params:
              tq8_rerank: [true]
              L: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]
              k: [100]
              config:
                - { name: nr200, num_rerank: 200 }
                - { name: nr500, num_rerank: 500 }

  # -------------------- SVH Graph --------------------
  - name: svh_graph
    metric: ip
    builds:
      - build_name: svh_graph_R64_L128_a1.0
        build_params:
          R: 64
          L: 128
          alpha: 1.0
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              L: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
              k: [10]
              config:
                - { name: nr50,    num_rerank: 50 }
                - { name: nr100,   num_rerank: 100 }
          - name: k=100
            params:
              tq8_rerank: [true]
              L: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]
              k: [100]
              config:
                - { name: nr500,    num_rerank: 500 }
                - { name: nr1000,   num_rerank: 1000 }

  # -------------------- FastPlaid (BEIR-5 only) --------------------
  - name: fastplaid
    metric: ip
    builds:
      - build_name: fastplaid_nbits2
        build_params:
          nbits: 2
        search_configs:
          - name: k=10
            params:
              n_ivf_probe: [1, 2, 4, 8, 16]
              k: [10]
              config:
                - { name: nr256, num_rerank: 256 }
                - { name: nr1024, num_rerank: 1024 }
                - { name: nr4096, num_rerank: 4096 }

  # -------------------- IGP (BEIR-5 only) --------------------
  - name: igp
    metric: ip
    builds:
      - build_name: igp_nbit2
        build_params:
          n_bit: 2
          n_centroid_factor: 16
          kmeans_niter: 20
          kmeans_seed: 123
          kmeans_sample_max_vectors: 2000000
          assign_batch_size: 100000
          residual_batch_size: 100000
          kmeans_gpu: false
        search_configs:
          - name: k=10
            # IGP search has no separate num_rerank knob -- ``probe_topk`` is
            # the count of candidates that pass through the decode + refine
            # pipeline before the final top-k. Paper's grid for k=10 sweeps
            # probe_topk over [100, 200, 300, 400, 600] and the headline
            # high-recall point uses probe_topk=1400, so we cover that range.
            params:
              nprobe: [1, 2, 4, 8, 16, 32]
              k: [10]
              config:
                - { name: nr100,  probe_topk: 100 }
                - { name: nr200,  probe_topk: 200 }
                - { name: nr400,  probe_topk: 400 }
                - { name: nr600,  probe_topk: 600 }
                - { name: nr1400,  probe_topk: 1400 }

  # -------------------- GEM (BEIR-5 only) --------------------
  # Paper §5.1.3 query defaults: t=4; vary ef_search and #rerank for Pareto curves.
  # Reported headline ef_search (MSMARCO): 800 @ k=10, 2000 @ k=100, 8000 @ k=1k.
  # Grid below is for latency sweeps (QPS floor trims tail), not a single paper point.
  - name: gem
    metric: ip
    builds:
      - build_name: gem_m24_ef80
        build_params:
          m_index: 24                    # M (fixed at build)
          ef_construction: 80            # ef_construction (fixed at build)
          num_doc_shards: 1
        search_configs:
          - name: k=10
            params:
              nprobe: [4]                # t — per-query-token top-t cluster filter (§5.1.3, §5.4.1)
              ef_search: [100, 200, 400, 800, 2000, 4000]  # ef_search — graph beam width
              k: [10]                    # k — result size |R^(k)|
              config:
                - { name: nr256,  rerank_k: 256 }   # #rerank — chamfer rerank pool size
                - { name: nr512,  rerank_k: 512 }   # (paper Fig. 12 sweeps; upstream ex. uses 512 @ k=100)
                - { name: nr1024, rerank_k: 1024 }

  # -------------------- hnswlib (BEIR-5 only) --------------------
  # Flat token HNSW baseline: same ef_search / #rerank sweep shape as GEM for plots.
  # No cluster filter (no t); graph build uses M=16, ef_construction=200 (not paper MVG).
  - name: hnswlib
    metric: ip
    builds:
      - build_name: hnswlib_m16_ef200
        build_params:
          m_index: 16                    # M (runner default; paper MVG: 24)
          ef_construction: 200           # ef_construction (runner default; paper MVG: 80)
        search_configs:
          - name: k=10
            params:
              ef_search: [100, 200, 400, 800, 2000, 4000]  # ef_search
              k: [10]
              config:
                - { name: nr256,  rerank_k: 256 }   # #rerank
                - { name: nr512,  rerank_k: 512 }
                - { name: nr1024, rerank_k: 1024 }
