name: "Main experiments latency (BEIR)"

# `is_mmap: true` mmaps the points (database) PCS file at load time. Queries
# are loaded normally. Match the build config so we don't double-RAM the data.

datasets:
  - { name: nfcorpus, path: data/beir/nfcorpus, index_dir: results/indexes/nfcorpus, results_dir: experiments/latency/results/nfcorpus, is_mmap: true }
  - { name: scifact,  path: data/beir/scifact,  index_dir: results/indexes/scifact,  results_dir: experiments/latency/results/scifact,  is_mmap: true }
  - { name: arguana,  path: data/beir/arguana,  index_dir: results/indexes/arguana,  results_dir: experiments/latency/results/arguana,  is_mmap: true }
  - { name: scidocs,  path: data/beir/scidocs,  index_dir: results/indexes/scidocs,  results_dir: experiments/latency/results/scidocs,  is_mmap: true }
  - { name: fiqa,     path: data/beir/fiqa,     index_dir: results/indexes/fiqa,     results_dir: experiments/latency/results/fiqa,     is_mmap: true }
  - { name: quora,    path: data/beir/quora,    index_dir: results/indexes/quora,    results_dir: experiments/latency/results/quora,    is_mmap: true }
  - { name: nq,       path: data/beir/nq,       index_dir: results/indexes/nq,       results_dir: experiments/latency/results/nq,       is_mmap: true }
  - { name: hotpotqa, path: data/beir/hotpotqa, index_dir: results/indexes/hotpotqa, results_dir: experiments/latency/results/hotpotqa, is_mmap: true }
  - { name: nq500k,   path: data/beir/nq500k,   index_dir: results/indexes/nq500k,   results_dir: experiments/latency/results/nq500k,   is_mmap: true }

# Notation for variants/quantizers:
#   quantizer = "TQ"         -> 4-bit TurboQuant (greedy + leaf scoring path)
#   quantizer = "OneBitTQ"   -> 1-bit TurboQuant (leaf-probing variant)
#   quantizer = "EightBitTQ" -> 8-bit TurboQuant (used for build / reranking)
# Reranking is configured via SearchParams.num_rerank in each search_config;
# `tq8_rerank: true` makes the rerank step use 8-bit TurboQuant.

indices:
  # -------------------- MVIVF --------------------
  # Greedy: TQ4bit, Leaf probing: TQ1bit (variant), Rerank: TQ8bit (num_rerank>0).
  - name: mvivf
    metric: ip
    builds:
      - build_name: mvivf_k0_l100_d0_nit5_s0_mpcc100
        build_params:
          k_per_level: 0
          max_leaf_size: 100
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          build_with_8btq: true
        variants:
          - { name: tq1, compress: true, quantizer: OneBitTQ }   # 1-bit leaf probing
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
              k: [10]
              config:
                - { name: nr20,   num_rerank: 20 }
                - { name: nr40,   num_rerank: 40 }
                - { name: nr60,  num_rerank: 60 }
                - { name: nr80,  num_rerank: 80 }

  # -------------------- MUVERA --------------------
  # Build: FDE+Vamana. Search: Vamana w/ TQ4bit. Rerank: TQ8bit via num_rerank.
  - name: muvera
    metric: ip
    builds:
      - build_name: muvera_10240_R200_L600_a1.0
        build_params:
          d_fde: 10240
          R: 200
          L: 600
          alpha: 1.0
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              L: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
              k: [10]
              config:
                - { name: nr1000,   num_rerank: 1000 }
                - { name: nr2000,   num_rerank: 2000 }
                - { name: nr5000,   num_rerank: 5000 }
                - { name: nr10000,   num_rerank: 10000 }

  # -------------------- MV-Vamana --------------------
  - name: vamana
    metric: ip
    builds:
      - build_name: vamana_R64_L128_a1.0
        build_params:
          R: 64
          L: 128
          alpha: 1.0
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              L: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
              k: [10]
              config:
                - { name: nr20, num_rerank: 20 }
                - { name: nr40, num_rerank: 40 }
                - { name: nr60, num_rerank: 60 }
                - { name: nr80, num_rerank: 80 }

  # -------------------- SVH Graph --------------------
  # `L` is the sweep axis (`variable_param: L` in methods.yaml). Set `L`
  # *per* num_rerank bucket so each bucket walks beam widths >= num_rerank
  # plus a couple of small points to anchor the low-recall end of the curve.
  - name: svh_graph
    metric: ip
    builds:
      - build_name: svh_graph_R64_L128_a1.0
        build_params:
          R: 64
          L: 128
          alpha: 1.0
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              L: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
              k: [10]
              config:
                - { name: nr50,   num_rerank: 50}
                - { name: nr100,   num_rerank: 100}
                - { name: nr500,   num_rerank: 500}
                - { name: nr1000,   num_rerank: 1000}

  # -------------------- FastPlaid (BEIR only) --------------------
  - name: fastplaid
    metric: ip
    builds:
      - build_name: fastplaid_nbits4
        build_params:
          nbits: 4
        search_configs:
          - name: k=10
            params:
              n_ivf_probe: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048]
              k: [10]
              config:
                - { name: nr8,   num_rerank: 8 }
                - { name: nr64,   num_rerank: 64 }
                - { name: nr256,  num_rerank: 256 }
                - { name: nr1024, num_rerank: 1024 }
