name: "Main experiments latency (nq500k)"

# Standalone search config for the 500k subsample of NQ. Kept separate so its
# nprobes / num_rerank ladders can drift independently from the BEIR shards.
# FastPlaid is intentionally absent.

datasets:
  - { name: nq500k, path: data/beir/nq500k, index_dir: results/indexes/nq500k, results_dir: experiments/latency/results/nq500k, is_mmap: true }

indices:
  - name: mvivf
    metric: ip
    builds:
      - build_name: mvivf_k0_l100_d0_nit5_s0_mpcc100
        build_params:
          k_per_level: 0
          max_leaf_size: 100
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          build_with_8btq: true
        variants:
          - { name: tq1, compress: true, quantizer: OneBitTQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              query_compression: ["Wards"]
              query_compression_threshold: [0.5]
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
              k: [10]
              config:
                - { name: nr20,   num_rerank: 20 }
                - { name: nr50,   num_rerank: 50 }
                - { name: nr100,  num_rerank: 100 }
                - { name: nr500,  num_rerank: 500 }

  - name: muvera
    metric: ip
    builds:
      - build_name: muvera_10240_R200_L600_a1.0
        build_params:
          d_fde: 10240
          R: 200
          L: 600
          alpha: 1.0
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              L: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
              k: [10]
              config:
                - { name: nr500,   num_rerank: 500 }
                - { name: nr1000,   num_rerank: 1000 }
                - { name: nr5000,   num_rerank: 5000 }

  - name: vamana
    metric: ip
    builds:
      - build_name: vamana_R64_L128_a1.0
        build_params:
          R: 64
          L: 128
          alpha: 1.0
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              L: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
              k: [10]
              config:
                - { name: nr20, num_rerank: 20 }
                - { name: nr50, num_rerank: 40 }

  - name: svh_graph
    metric: ip
    builds:
      - build_name: svh_graph_R64_L128_a1.0
        build_params:
          R: 64
          L: 128
          alpha: 1.0
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              L: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
              k: [10]
              config:
                - { name: nr50,    num_rerank: 50 }
                - { name: nr100,   num_rerank: 100 }
                - { name: nr500,   num_rerank: 500 }
