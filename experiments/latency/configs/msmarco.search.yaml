name: "Main experiments latency (MS MARCO)"

# MS MARCO is kept as its own config so we can sweep different params (the
# corpus is much larger than the BEIR shards). Mirror the BEIR search
# definitions here -- override in this file as needed.

datasets:
  - { name: msmarco, path: data/beir/msmarco, index_dir: results/indexes/msmarco, results_dir: experiments/latency/results/msmarco, is_mmap: true }

indices:
  # -------------------- MVIVF --------------------
  # Greedy: TQ4bit, Leaf probing: TQ1bit (variant), Rerank: TQ8bit (num_rerank>0).
  - name: mvivf
    metric: ip
    builds:
      - build_name: mvivf_k0_l100_d0_nit5_s0_mpcc100
        build_params:
          k_per_level: 0
          max_leaf_size: 100
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          build_with_8btq: true
        variants:
          - { name: tq1, compress: true, quantizer: OneBitTQ }   # 1-bit leaf probing
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
              k: [10]
              config:
                - { name: nr20,   num_rerank: 20 }
                - { name: nr40,   num_rerank: 40 }
                - { name: nr60,  num_rerank: 60 }
                - { name: nr80,  num_rerank: 80 }

  # -------------------- MUVERA --------------------
  # Build: FDE+Vamana. Search: Vamana w/ TQ4bit. Rerank: TQ8bit via num_rerank.
  - name: muvera
    metric: ip
    builds:
      - build_name: muvera_10240_R200_L600_a1.0
        build_params:
          d_fde: 10240
          R: 200
          L: 600
          alpha: 1.0
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              L: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
              k: [10]
              config:
                - { name: nr1000,   num_rerank: 1000 }
                - { name: nr2000,   num_rerank: 2000 }
                - { name: nr5000,   num_rerank: 5000 }
                - { name: nr10000,   num_rerank: 10000 }

  # -------------------- MV-Vamana --------------------
  - name: vamana
    metric: ip
    builds:
      - build_name: vamana_R64_L128_a1.0
        build_params:
          R: 64
          L: 128
          alpha: 1.0
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              L: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
              k: [10]
              config:
                - { name: nr20, num_rerank: 20 }
                - { name: nr40, num_rerank: 40 }
                - { name: nr60, num_rerank: 60 }
                - { name: nr80, num_rerank: 80 }

  # -------------------- SVH Graph --------------------
  # `L` is the sweep axis (`variable_param: L` in methods.yaml). Set `L`
  # *per* num_rerank bucket so each bucket walks beam widths >= num_rerank
  # plus a couple of small points to anchor the low-recall end of the curve.
  - name: svh_graph
    metric: ip
    builds:
      - build_name: svh_graph_R64_L128_a1.0
        build_params:
          R: 64
          L: 128
          alpha: 1.0
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              L: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
              k: [10]
              config:
                - { name: nr50,   num_rerank: 50}
                - { name: nr100,   num_rerank: 100}
                - { name: nr500,   num_rerank: 500}
                - { name: nr1000,   num_rerank: 1000}

  # -------------------- FastPlaid (BEIR only) --------------------
  - name: fastplaid
    metric: ip
    builds:
      - build_name: fastplaid_nbits4
        build_params:
          nbits: 4
        search_configs:
          - name: k=10
            params:
              n_ivf_probe: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048]
              k: [10]
              config:
                - { name: nr8,   num_rerank: 8 }
                - { name: nr64,   num_rerank: 64 }
                - { name: nr256,  num_rerank: 256 }
                - { name: nr1024, num_rerank: 1024 }
