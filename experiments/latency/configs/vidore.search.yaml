name: "Main experiments latency (ViDoRe)"

datasets:
  - { name: docvqa,            path: data/vidore/docvqa,            index_dir: results/indexes/vidore/docvqa,            results_dir: experiments/latency/results/docvqa,            is_mmap: true }
  - { name: infovqa,           path: data/vidore/infovqa,           index_dir: results/indexes/vidore/infovqa,           results_dir: experiments/latency/results/infovqa,           is_mmap: true }
  - { name: arxivqa,           path: data/vidore/arxivqa,           index_dir: results/indexes/vidore/arxivqa,           results_dir: experiments/latency/results/arxivqa,           is_mmap: true }
  - { name: tabfquad,          path: data/vidore/tabfquad,          index_dir: results/indexes/vidore/tabfquad,          results_dir: experiments/latency/results/tabfquad,          is_mmap: true }
  - { name: chartqa,           path: data/vidore/chartqa,           index_dir: results/indexes/vidore/chartqa,           results_dir: experiments/latency/results/chartqa,           is_mmap: true }
  - { name: shiftproject,      path: data/vidore/shiftproject,      index_dir: results/indexes/vidore/shiftproject,      results_dir: experiments/latency/results/shiftproject,      is_mmap: true }
  - { name: synth_ai,          path: data/vidore/synth_ai,          index_dir: results/indexes/vidore/synth_ai,          results_dir: experiments/latency/results/synth_ai,          is_mmap: true }
  - { name: synth_energy,      path: data/vidore/synth_energy,      index_dir: results/indexes/vidore/synth_energy,      results_dir: experiments/latency/results/synth_energy,      is_mmap: true }
  - { name: synth_gov,         path: data/vidore/synth_gov,         index_dir: results/indexes/vidore/synth_gov,         results_dir: experiments/latency/results/synth_gov,         is_mmap: true }
  - { name: synth_healthcare,  path: data/vidore/synth_healthcare,  index_dir: results/indexes/vidore/synth_healthcare,  results_dir: experiments/latency/results/synth_healthcare,  is_mmap: true }

indices:
  # -------------------- MVIVF --------------------
  - name: mvivf
    metric: ip
    builds:
      - build_name: mvivf_k0_l100_d0_nit5_s0_mpcc100
        build_params:
          k_per_level: 0
          max_leaf_size: 100
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          build_with_8btq: true
        variants:
          - { name: tq1, compress: true, quantizer: OneBitTQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              query_compression: ["Wards"]
              query_compression_threshold: [0.5]
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
              k: [10]
              config:
                - { name: nr20,   num_rerank: 20 }
                - { name: nr50,   num_rerank: 50 }

  # -------------------- MUVERA --------------------
  - name: muvera
    metric: ip
    builds:
      - build_name: muvera_10240_R200_L600_a1.0
        build_params:
          d_fde: 10240
          R: 200
          L: 600
          alpha: 1.0
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              L: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
              k: [10]
              config:
                - { name: nr500,   num_rerank: 500 }
                - { name: nr1000,   num_rerank: 1000 }

  # -------------------- MV-Vamana --------------------
  - name: vamana
    metric: ip
    builds:
      - build_name: vamana_R64_L128_a1.0
        build_params:
          R: 64
          L: 128
          alpha: 1.0
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              L: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
              k: [10]
              config:
                - { name: nr20, num_rerank: 20 }
                - { name: nr50, num_rerank: 50 }

  # -------------------- SVH Graph --------------------
  - name: svh_graph
    metric: ip
    builds:
      - build_name: svh_graph_R64_L128_a1.0
        build_params:
          R: 64
          L: 128
          alpha: 1.0
        variants:
          - { name: tq4, quantizer: TQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              L: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
              k: [10]
              config:
                - { name: nr50,    num_rerank: 50 }
                - { name: nr100,   num_rerank: 100 }

  # -------------------- FastPlaid (BEIR-5 only) --------------------
  - name: fastplaid
    metric: ip
    builds:
      - build_name: fastplaid_nbits4
        build_params:
          nbits: 4
        search_configs:
          - name: k=10
            params:
              n_ivf_probe: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
              k: [10]
              config:
                - { name: nr512, num_rerank: 512 }
                - { name: nr1024, num_rerank: 1024 }
