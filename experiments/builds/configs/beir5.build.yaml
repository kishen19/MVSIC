name: "Main experiments build (BEIR-5: nfcorpus, scifact, arguana, scidocs, fiqa)"

# Index binaries land at <index_dir>/<index_name>/<build_name>/index.bin .
# Configs reference results/indexes/<dataset>/ which can be a symlink to
# scratch storage; only the (large) index files live there. Everything else
# (CSVs, plots, build_stats markdown) stays under experiments/.
#
# `is_mmap: true` mmaps the points (database) PCS file at load time. Queries
# are always loaded normally. Kept on for parity with the bigger BEIR shards.
#
# These five BEIR-5 corpora share one set of build params; for the larger
# BEIR shards (nq, hotpotqa, quora) see beirbig.build.yaml, and for nq500k
# see nq500k.build.yaml.

datasets:
  - { name: nfcorpus, path: data/beir/nfcorpus, index_dir: results/indexes/nfcorpus, is_mmap: true }
  - { name: scifact,  path: data/beir/scifact,  index_dir: results/indexes/scifact,  is_mmap: true }
  - { name: arguana,  path: data/beir/arguana,  index_dir: results/indexes/arguana,  is_mmap: true }
  - { name: scidocs,  path: data/beir/scidocs,  index_dir: results/indexes/scidocs,  is_mmap: true }
  - { name: fiqa,     path: data/beir/fiqa,     index_dir: results/indexes/fiqa,     is_mmap: true }

indices:
  # ----- MVIVF. TQ4/TQ1/TQ8 are search-time variants; build `build_with_8btq` uses
  # 8-bit TurboQuant for the MVIVF k-means assignment path. -----
  - name: mvivf
    metric: ip
    build_configs:
      - name: mvivf_k0_l100_d0_nit5_s0_mpcc100
        params:
          verbose: 1
          k_per_level: 0
          max_leaf_size: 100
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          build_with_8btq: true

  # ----- MVIVF Spill (level-1 spill = 2). Same skeleton as mvivf otherwise. -----
  - name: mvivf_spill
    metric: ip
    build_configs:
      - name: mvivf_k0_l100_d0_nit5_s0_mpcc100_spill_2_1
        params:
          verbose: 1
          k_per_level: 0
          max_leaf_size: 100
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          build_with_8btq: true
          num_spill: 2
          num_spill_l2: 1

  # ----- MUVERA: d_fde=10240, Vamana R=200 / L=600 (winner from ablations). -----
  - name: muvera
    metric: ip
    build_configs:
      - name: muvera_10240_R200_L600_a1.0
        params:
          verbose: 2
          d_fde: 10240
          R: 200
          L: 600
          alpha: 1.0

  # ----- MV-Vamana. -----
  - name: vamana
    metric: ip
    build_configs:
      - name: vamana_R64_L128_a1.0
        params:
          verbose: 1
          R: 64
          L: 128
          alpha: 1.0

  # ----- SVH Graph (single-vector Vamana-style graph over SVH embeddings). -----
  - name: svh_graph
    metric: ip
    build_configs:
      - name: svh_graph_R64_L128_a1.0
        params:
          verbose: 1
          R: 64
          L: 128
          alpha: 1.0

  # ----- FastPlaid (BEIR-5 only). Build via FastPlaidWrapper.create. -----
  - name: fastplaid
    metric: ip
    build_configs:
      - name: fastplaid_nbits4
        params:
          nbits: 4

  # ----- IGP (BEIR-5 only). Build via IGPWrapper.create. -----
  - name: igp
    metric: ip
    build_configs:
      - name: igp_nbit2
        params:
          n_bit: 2
          n_centroid_factor: 16
          kmeans_niter: 20
          kmeans_seed: 123
          # Upstream's default samples ~all vectors for BEIR-5 shards; 2M is
          # safely above arguana / scifact / nfcorpus total vec counts so
          # k-means trains on the full corpus, matching the paper.
          kmeans_sample_max_vectors: 2000000
          assign_batch_size: 100000
          residual_batch_size: 100000
          kmeans_gpu: false
