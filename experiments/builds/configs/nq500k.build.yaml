name: "Main experiments build (nq500k)"

# Standalone build config for the 500k subsample of NQ. Kept separate so its
# build/search params can drift independently from the BEIR shards. FastPlaid
# is intentionally absent.

datasets:
  - { name: nq500k, path: data/beir/nq500k, index_dir: results/indexes/nq500k, is_mmap: true }

indices:
  - name: mvivf
    metric: ip
    build_configs:
      - name: mvivf_k0_l100_d0_nit5_s0_mpcc100
        params:
          verbose: 1
          k_per_level: 0
          max_leaf_size: 100
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          build_with_8btq: true

  - name: muvera
    metric: ip
    build_configs:
      - name: muvera_10240_R200_L600_a1.0
        params:
          verbose: 1
          d_fde: 10240
          R: 200
          L: 600
          alpha: 1.0

  - name: vamana
    metric: ip
    build_configs:
      - name: vamana_R64_L128_a1.0
        params:
          verbose: 1
          R: 64
          L: 128
          alpha: 1.0

  - name: svh_graph
    metric: ip
    build_configs:
      - name: svh_graph_R64_L128_a1.0
        params:
          verbose: 1
          R: 64
          L: 128
          alpha: 1.0
