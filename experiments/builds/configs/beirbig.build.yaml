name: "Main experiments build (BEIR-big: quora, nq, hotpotqa)"

# Larger BEIR shards. Mirrors beir5.build.yaml structurally so we can tune a
# different set of build params here later (e.g. larger leaves / more iters)
# without churning the BEIR-5 file. FastPlaid is intentionally absent: its
# memory profile is too large on these shards.
#
# For nq500k (separate single-shard config), see nq500k.build.yaml.

datasets:
  - { name: quora,    path: data/beir/quora,    index_dir: results/indexes/quora,    is_mmap: true }
  - { name: nq,       path: data/beir/nq,       index_dir: results/indexes/nq,       is_mmap: true }
  - { name: hotpotqa, path: data/beir/hotpotqa, index_dir: results/indexes/hotpotqa, is_mmap: true }

indices:
  - name: mvivf
    metric: ip
    build_configs:
      - name: mvivf_k0_l500_d0_nit5_s0_mpcc100
        params:
          verbose: 1
          k_per_level: 0
          max_leaf_size: 500
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          build_with_8btq: true

  - name: mvivf_spill
    metric: ip
    build_configs:
      - name: mvivf_k0_l500_d0_nit5_s0_mpcc100_spill_2_1
        params:
          verbose: 1
          k_per_level: 0
          max_leaf_size: 500
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          build_with_8btq: true
          num_spill: 2
          num_spill_l2: 1

  - name: muvera
    metric: ip
    build_configs:
      - name: muvera_10240_R200_L600_a1.0
        params:
          verbose: 1
          d_fde: 10240
          R: 200
          L: 600
          alpha: 1.0

  - name: vamana
    metric: ip
    build_configs:
      - name: vamana_R64_L128_a1.0
        params:
          verbose: 1
          R: 64
          L: 128
          alpha: 1.0

  - name: svh_graph
    metric: ip
    build_configs:
      - name: svh_graph_R64_L128_a1.0
        params:
          verbose: 1
          R: 64
          L: 128
          alpha: 1.0
