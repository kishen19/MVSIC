name: "Main experiments build (ViDoRe)"

datasets:
  - { name: docvqa,            path: data/vidore/docvqa,            index_dir: results/indexes/vidore/docvqa,            is_mmap: true }
  - { name: infovqa,           path: data/vidore/infovqa,           index_dir: results/indexes/vidore/infovqa,           is_mmap: true }
  - { name: arxivqa,           path: data/vidore/arxivqa,           index_dir: results/indexes/vidore/arxivqa,           is_mmap: true }
  - { name: tabfquad,          path: data/vidore/tabfquad,          index_dir: results/indexes/vidore/tabfquad,          is_mmap: true }
  - { name: chartqa,           path: data/vidore/chartqa,           index_dir: results/indexes/vidore/chartqa,           is_mmap: true }
  - { name: shiftproject,      path: data/vidore/shiftproject,      index_dir: results/indexes/vidore/shiftproject,      is_mmap: true }
  - { name: synth_ai,          path: data/vidore/synth_ai,          index_dir: results/indexes/vidore/synth_ai,          is_mmap: true }
  - { name: synth_energy,      path: data/vidore/synth_energy,      index_dir: results/indexes/vidore/synth_energy,      is_mmap: true }
  - { name: synth_gov,         path: data/vidore/synth_gov,         index_dir: results/indexes/vidore/synth_gov,         is_mmap: true }
  - { name: synth_healthcare,  path: data/vidore/synth_healthcare,  index_dir: results/indexes/vidore/synth_healthcare,  is_mmap: true }

indices:
  - name: mvivf
    metric: ip
    build_configs:
      - name: mvivf_k0_l100_d0_nit5_s0_mpcc100
        params:
          verbose: 1
          k_per_level: 0
          max_leaf_size: 100
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          build_with_8btq: true

  - name: mvivf_spill
    metric: ip
    build_configs:
      - name: mvivf_k0_l100_d0_nit5_s0_mpcc100_spill_2_1
        params:
          verbose: 1
          k_per_level: 0
          max_leaf_size: 100
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          build_with_8btq: true
          num_spill: 2
          num_spill_l2: 1

  - name: muvera
    metric: ip
    build_configs:
      - name: muvera_10240_R200_L600_a1.0
        params:
          verbose: 1
          d_fde: 10240
          R: 200
          L: 600
          alpha: 1.0

  - name: vamana
    metric: ip
    build_configs:
      - name: vamana_R64_L128_a1.0
        params:
          verbose: 1
          R: 64
          L: 128
          alpha: 1.0

  - name: svh_graph
    metric: ip
    build_configs:
      - name: svh_graph_R64_L128_a1.0
        params:
          verbose: 1
          R: 64
          L: 128
          alpha: 1.0

  # FastPlaid intentionally omitted: only run on BEIR.
