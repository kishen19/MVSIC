name: "Main experiments build (ViDoRe)"

datasets:
  - { name: docvqa,   path: data/vidore/docvqa,   index_dir: results/indexes/vidore/docvqa   }
  - { name: infovqa,  path: data/vidore/infovqa,  index_dir: results/indexes/vidore/infovqa  }
  - { name: arxivqa,  path: data/vidore/arxivqa,  index_dir: results/indexes/vidore/arxivqa  }
  - { name: tabfquad, path: data/vidore/tabfquad, index_dir: results/indexes/vidore/tabfquad }
  - { name: chartqa,  path: data/vidore/chartqa,  index_dir: results/indexes/vidore/chartqa  }
  - { name: shiftproject,    path: data/vidore/shiftproject,    index_dir: results/indexes/vidore/shiftproject    }
  - { name: synth_ai,        path: data/vidore/synth_ai,        index_dir: results/indexes/vidore/synth_ai        }
  - { name: synth_energy,    path: data/vidore/synth_energy,    index_dir: results/indexes/vidore/synth_energy    }
  - { name: synth_gov,       path: data/vidore/synth_gov,       index_dir: results/indexes/vidore/synth_gov       }
  - { name: synth_healthcare, path: data/vidore/synth_healthcare, index_dir: results/indexes/vidore/synth_healthcare }

indices:
  - name: mvivf
    metric: ip
    build_configs:
      - name: mvivf_k0_l100_d0_n5_s0_mpcc100
        params:
          verbose: 1
          k_per_level: 0
          max_leaf_size: 100
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          pq_method: 7
          quantize_centers: true

  - name: muvera
    metric: ip
    build_configs:
      - name: muvera_2560_R200_L600
        params:
          verbose: 1
          d_fde: 2560
          R: 200
          L: 600
          pq_method: 0
          quantize_centers: false

  - name: vamana
    metric: ip
    build_configs:
      - name: vamana_R200
        params:
          verbose: 1
          R: 200
          pq_method: 0
          quantize_centers: false

  - name: svh_graph
    metric: ip
    build_configs:
      - name: svh_graph_R200
        params:
          verbose: 1
          R: 200
          L: 600

  # FastPlaid intentionally omitted: only run on BEIR5.
