name: "Optimizations ladder (search)"

# Five MVIVF stages, each adding one optimization on top of the previous.
# All stages share build `mvivf_k0_l500_d0_nit5_s0_mpcc100` (one on-disk index).
#
# C++ class mapping (benchmark_search.py `_resolve_class`):
#   compress=false, quantizer=None     -> IndexMVIVFIP           (full chamfer)
#   compress=false, quantizer=OneBitTQ -> IndexMVIVFOneBitTQIP   (+ leaf TQ-1bit)
#   compress=true,  quantizer=OneBitTQ -> IndexMVIVFCompressOneBitTQIP (+ tree TQ-4bit on centers)
#
# Ladder order (cumulative):
#   s0_baseline       raw chamfer leaves + raw centers; num_rerank=0
#   s1_leaf_tq1bit    + 1-bit TurboQuant on leaf scoring
#   s2_tree_compress  + 4-bit TurboQuant on tree centers (keeps leaf TQ-1bit)
#   s3_query_compress + Wards query compression @ τ=0.5
#   s4_rerank_tq8bit  swap full chamfer rerank -> 8-bit TQ rerank (tq8_rerank)
#
# Rerank policy:
#   s0: num_rerank=0 only — exact chamfer leaves; no rerank sweep.
#   s1..s4: sweep num_rerank (chamfer rerank on s1..s3, TQ-8 on s4). plot.py merges
#           all latency_results_nr*.csv per stage into one Pareto (best QPS at each recall).
#
# Spilling (mvivf_spill) is intentionally out of scope here; see mvivf_ablation.
#
# Each stage is a separate `builds[]` entry (same build_name, different variant +
# search_configs) because benchmark_search.py attaches search_configs per build,
# not per variant.

datasets:
  - { name: nfcorpus, path: data/beir/nfcorpus, index_dir: results/optimizations/indices/nfcorpus, results_dir: experiments/optimizations/results/nfcorpus, is_mmap: true }
  - { name: scifact,  path: data/beir/scifact,  index_dir: results/optimizations/indices/scifact,  results_dir: experiments/optimizations/results/scifact,  is_mmap: true }
  - { name: arguana,  path: data/beir/arguana,  index_dir: results/optimizations/indices/arguana,  results_dir: experiments/optimizations/results/arguana,  is_mmap: true }
  - { name: scidocs,  path: data/beir/scidocs,  index_dir: results/optimizations/indices/scidocs,  results_dir: experiments/optimizations/results/scidocs,  is_mmap: true }
  - { name: fiqa,     path: data/beir/fiqa,     index_dir: results/optimizations/indices/fiqa,     results_dir: experiments/optimizations/results/fiqa,     is_mmap: true }
  - { name: quora,    path: data/beir/quora,    index_dir: results/optimizations/indices/quora,    results_dir: experiments/optimizations/results/quora,    is_mmap: true }
  - { name: nq,       path: data/beir/nq,       index_dir: results/optimizations/indices/nq,       results_dir: experiments/optimizations/results/nq,       is_mmap: true }
  - { name: hotpotqa, path: data/beir/hotpotqa, index_dir: results/optimizations/indices/hotpotqa, results_dir: experiments/optimizations/results/hotpotqa, is_mmap: true }
  - { name: nq500k,   path: data/beir/nq500k,   index_dir: results/optimizations/indices/nq500k,   results_dir: experiments/optimizations/results/nq500k,   is_mmap: true }

_anchors:
  nprobes_sweep: &NPROBES
    nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
  # Same rerank grid as beir5 MVIVF k=10 (matches main latency experiments).
  rerank_sweep: &RERANK_SWEEP
    - { name: nr20,  num_rerank: 20 }
    - { name: nr50,  num_rerank: 50 }
    - { name: nr100, num_rerank: 100 }
    - { name: nr500, num_rerank: 500 }
  # TQ-8 rerank needs a larger pool than chamfer to match recall (see arguana s4).
  rerank_sweep_tq8: &RERANK_SWEEP_TQ8
    - { name: nr20,   num_rerank: 20 }
    - { name: nr50,   num_rerank: 50 }
    - { name: nr100,  num_rerank: 100 }
    - { name: nr500,  num_rerank: 500 }
    - { name: nr1000, num_rerank: 1000 }
  mvivf_l500_raw: &MVIVF_L500_RAW
    k_per_level: 0
    max_leaf_size: 500
    max_depth: 0
    niters: 5
    max_point_clouds_per_cluster: 100
    max_points_per_centroid_inner_kmeans: 20
    build_with_8btq: true

indices:
  - name: mvivf
    metric: ip
    builds:
      # ---- Stage 0: full chamfer (IndexMVIVFIP) ----
      - build_name: mvivf_k0_l500_d0_nit5_s0_mpcc100
        build_params: *MVIVF_L500_RAW
        variants:
          - { name: s0_baseline, compress: false, quantizer: None }
        search_configs:
          - name: k=10
            params:
              <<: *NPROBES
              k: [10]
              tq8_rerank: [false]
              config:
                - { name: nr0, num_rerank: 0 }

      # ---- Stage 1: + leaf 1-bit TQ (IndexMVIVFOneBitTQIP) ----
      - build_name: mvivf_k0_l500_d0_nit5_s0_mpcc100
        build_params: *MVIVF_L500_RAW
        variants:
          - { name: s1_leaf_tq1bit, compress: false, quantizer: OneBitTQ }
        search_configs:
          - name: k=10
            params:
              <<: *NPROBES
              k: [10]
              tq8_rerank: [false]
              config: *RERANK_SWEEP

      # ---- Stage 2: + tree 4-bit TQ on centers (IndexMVIVFCompressOneBitTQIP) ----
      - build_name: mvivf_k0_l500_d0_nit5_s0_mpcc100
        build_params: *MVIVF_L500_RAW
        variants:
          - { name: s2_tree_compress, compress: true, quantizer: OneBitTQ }
        search_configs:
          - name: k=10
            params:
              <<: *NPROBES
              k: [10]
              tq8_rerank: [false]
              config: *RERANK_SWEEP

      # ---- Stage 3: + Wards query compression ----
      - build_name: mvivf_k0_l500_d0_nit5_s0_mpcc100
        build_params: *MVIVF_L500_RAW
        variants:
          - { name: s3_query_compress, compress: true, quantizer: OneBitTQ }
        search_configs:
          - name: k=10
            params:
              <<: *NPROBES
              k: [10]
              tq8_rerank: [false]
              query_compression: ["Wards"]
              query_compression_threshold: [0.5]
              config: *RERANK_SWEEP

      # ---- Stage 4: chamfer rerank -> 8-bit TQ rerank (extended num_rerank grid) ----
      - build_name: mvivf_k0_l500_d0_nit5_s0_mpcc100
        build_params: *MVIVF_L500_RAW
        variants:
          - { name: s4_rerank_tq8bit, compress: true, quantizer: OneBitTQ }
        search_configs:
          - name: k=10
            params:
              <<: *NPROBES
              k: [10]
              tq8_rerank: [true]
              query_compression: ["Wards"]
              query_compression_threshold: [0.5]
              config: *RERANK_SWEEP_TQ8
