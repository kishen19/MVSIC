name: "Quantization compare search (BEIR-5: nfcorpus, scifact, arguana, scidocs, fiqa)"

datasets:
  - { name: nfcorpus, path: data/beir/nfcorpus, index_dir: results/indexes/nfcorpus, results_dir: experiments/quantization_compare/results/nfcorpus, is_mmap: true }
  - { name: scifact,  path: data/beir/scifact,  index_dir: results/indexes/scifact,  results_dir: experiments/quantization_compare/results/scifact,  is_mmap: true }
  - { name: arguana,  path: data/beir/arguana,  index_dir: results/indexes/arguana,  results_dir: experiments/quantization_compare/results/arguana,  is_mmap: true }
  - { name: scidocs,  path: data/beir/scidocs,  index_dir: results/indexes/scidocs,  results_dir: experiments/quantization_compare/results/scidocs,  is_mmap: true }
  - { name: fiqa,     path: data/beir/fiqa,     index_dir: results/indexes/fiqa,     results_dir: experiments/quantization_compare/results/fiqa,     is_mmap: true }

indices:
  # -------------------- MVIVF --------------------
  - name: mvivf
    metric: ip
    builds:
      - build_name: mvivf_k0_l100_d0_nit5_s0_mpcc100
        build_params:
          k_per_level: 0
          max_leaf_size: 100
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          build_with_8btq: true
        variants:
          - { name: tq1, compress: true, quantizer: OneBitTQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              query_compression: ["Wards"]
              query_compression_threshold: [0.5]
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
              k: [10]
              config:
                - { name: nr100,   num_rerank: 100 }
                - { name: nr500,   num_rerank: 500 }
      - build_name: mvivf_k0_l100_d0_nit5_s0_mpcc100
        build_params:
          k_per_level: 0
          max_leaf_size: 100
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          build_with_8btq: true
        variants:
          - { name: fs, compress: true, quantizer: FastScan, block_size: 8 }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              query_compression: ["Wards"]
              query_compression_threshold: [0.5]
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
              k: [10]
              config:
                - { name: nr500,   num_rerank: 500 }
                - { name: nr1000,   num_rerank: 1000 }