name: "Quantization compare search (BEIR-big: quora, nq, hotpotqa)"

datasets:
  - { name: quora,    path: data/beir/quora,    index_dir: results/indexes/quora,    results_dir: experiments/quantization_compare/results/quora,    is_mmap: true }
  - { name: nq,       path: data/beir/nq,       index_dir: results/indexes/nq,       results_dir: experiments/quantization_compare/results/nq,       is_mmap: true }
  - { name: hotpotqa, path: data/beir/hotpotqa, index_dir: results/indexes/hotpotqa, results_dir: experiments/quantization_compare/results/hotpotqa, is_mmap: true }

indices:
  # -------------------- MVIVF --------------------
  - name: mvivf
    metric: ip
    builds:
      - build_name: mvivf_k0_l500_d0_nit5_s0_mpcc100
        build_params:
          k_per_level: 0
          max_leaf_size: 500
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          build_with_8btq: true
        variants:
          - { name: tq1, compress: true, quantizer: OneBitTQ }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              query_compression: ["Wards"]
              query_compression_threshold: [0.5]
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]
              k: [10]
              config:
                - { name: nr100,   num_rerank: 100 }
                - { name: nr500,   num_rerank: 500 }
      - build_name: mvivf_k0_l500_d0_nit5_s0_mpcc100
        build_params:
          k_per_level: 0
          max_leaf_size: 500
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          build_with_8btq: true
        variants:
          - { name: fs, compress: true, quantizer: FastScan, block_size: 8 }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              query_compression: ["Wards"]
              query_compression_threshold: [0.5]
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]
              k: [10]
              config:
                - { name: nr500,   num_rerank: 500 }
                - { name: nr1000,   num_rerank: 1000 }
      - build_name: mvivf_k0_l500_d0_nit5_s0_mpcc100
        build_params:
          k_per_level: 0
          max_leaf_size: 500
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          build_with_8btq: true
        variants:
          - { name: tq4, compress: true, quantizer: TurboQuant }
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              query_compression: ["Wards"]
              query_compression_threshold: [0.5]
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]
              k: [10]
              config:
                - { name: nr100,   num_rerank: 100 }
                - { name: nr500,   num_rerank: 500 }