name: "Quantization compare build (BEIR-big: quora, nq, hotpotqa)"


datasets:
  - { name: quora,    path: data/beir/quora,    index_dir: results/indexes/quora,    is_mmap: true }
  - { name: nq,       path: data/beir/nq,       index_dir: results/indexes/nq,       is_mmap: true }
  - { name: hotpotqa, path: data/beir/hotpotqa, index_dir: results/indexes/hotpotqa, is_mmap: true }

indices:
  - name: mvivf
    metric: ip
    build_configs:
      - name: mvivf_k0_l500_d0_nit5_s0_mpcc100
        params:
          verbose: 1
          k_per_level: 0
          max_leaf_size: 500
          max_depth: 0
          niters: 5
          s: 0
          max_point_clouds_per_cluster: 100
          build_with_8btq: true
