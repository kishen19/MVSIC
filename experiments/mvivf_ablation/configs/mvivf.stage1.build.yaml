name: "MVIVF Ablation (build, stage 1: k_per_level)"

datasets:
  - name: arguana
    path: data/beir/arguana
    index_dir: results/mvivf_ablation/indices/arguana
  - name: fiqa
    path: data/beir/fiqa
    index_dir: results/mvivf_ablation/indices/fiqa
  - name: hotpotqa
    path: data/beir/hotpotqa
    index_dir: results/mvivf_ablation/indices/hotpotqa
  - name: nfcorpus
    path: data/beir/nfcorpus
    index_dir: results/mvivf_ablation/indices/nfcorpus
  - name: nq
    path: data/beir/nq
    index_dir: results/mvivf_ablation/indices/nq
  - name: nq500k
    path: data/beir/nq500k
    index_dir: results/mvivf_ablation/indices/nq500k
  - name: quora
    path: data/beir/quora
    index_dir: results/mvivf_ablation/indices/quora
  - name: scidocs
    path: data/beir/scidocs
    index_dir: results/mvivf_ablation/indices/scidocs
  - name: scifact
    path: data/beir/scifact
    index_dir: results/mvivf_ablation/indices/scifact

indices:
  - name: mvivf
    metric: ip
    build_configs:
      # ---------- Stage 1: k_per_level ----------
      - name: mvivf_k0_l500
        params: &stage1_defaults
          k_per_level: 0
          max_leaf_size: 500
          max_depth: 0
          niters: 5
          max_point_clouds_per_cluster: 100
          max_points_per_centroid_inner_kmeans: 20
          build_with_8btq: true
      - name: mvivf_k4_l500
        params: { <<: *stage1_defaults, k_per_level: 4 }
      - name: mvivf_k8_l500
        params: { <<: *stage1_defaults, k_per_level: 8 }
      - name: mvivf_k16_l500
        params: { <<: *stage1_defaults, k_per_level: 16 }
      - name: mvivf_k32_l500
        params: { <<: *stage1_defaults, k_per_level: 32 }

      # ---------- Stage 2: max_depth (update k_per_level to stage-1 winner) ----------
      # - name: mvivf_k16_d3
      #   params: { <<: *stage1_defaults, k_per_level: 16, max_depth: 3 }
      # - name: mvivf_k16_d4
      #   params: { <<: *stage1_defaults, k_per_level: 16, max_depth: 4 }

      # ---------- Stage 3: max_leaf_size ----------
      # (enable after Stage 2)

      # ---------- Stage 4: niters ----------
      # (enable after Stage 3)

      # ---------- Stage 5: mpcc / mpcik ----------
      # (enable after Stage 4)

      # ---------- Stage 6: s ----------
      # (enable after Stage 5)
