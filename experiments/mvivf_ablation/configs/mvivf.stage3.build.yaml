name: "MVIVF Ablation (build, stage 3: max_depth)"

datasets:
  - name: nq
    path: data/beir/nq
    index_dir: results/mvivf_ablation/indices/nq
  - name: nq500k
    path: data/beir/nq500k
    index_dir: results/mvivf_ablation/indices/nq500k
  - name: fiqa
    path: data/beir/fiqa
    index_dir: results/mvivf_ablation/indices/fiqa
  - name: arguana
    path: data/beir/arguana
    index_dir: results/mvivf_ablation/indices/arguana

indices:
  - name: mvivf
    metric: ip
    build_configs:
      # Stage-1 winner fixed: k_per_level = 0.
      # Stage-2 winner fixed: max_leaf_size = 100.
      - name: mvivf_k0_l100_d0
        params: &stage3_defaults
          k_per_level: 0
          max_leaf_size: 100
          max_depth: 0
          niters: 5
          max_point_clouds_per_cluster: 100
          max_points_per_centroid_inner_kmeans: 20
      - name: mvivf_k0_l100_d1
        params: { <<: *stage3_defaults, max_depth: 1 }
      - name: mvivf_k0_l100_d2
        params: { <<: *stage3_defaults, max_depth: 2 }
      - name: mvivf_k0_l100_d3
        params: { <<: *stage3_defaults, max_depth: 3 }
      - name: mvivf_k0_l100_d4
        params: { <<: *stage3_defaults, max_depth: 4 }
      - name: mvivf_k0_l100_d5
        params: { <<: *stage3_defaults, max_depth: 5 }

