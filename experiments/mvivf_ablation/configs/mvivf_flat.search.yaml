name: "MVIVF_Flat Ablation (search)"

datasets:
  - name: nq500k
    path: data/beir/nq500k
    index_dir:   experiments/mvivf_ablation/indices/nq500k
    results_dir: experiments/mvivf_ablation/results/nq500k
  - name: fiqa
    path: data/beir/fiqa
    index_dir:   experiments/mvivf_ablation/indices/fiqa
    results_dir: experiments/mvivf_ablation/results/fiqa

indices:
  - name: mvivf_flat
    metric: ip
    builds:
      - build_name: flat_128
        build_params: &flat_defaults
          k_per_level: 128
          niters: 5
          max_point_clouds_per_cluster: 100
          max_points_per_centroid_inner_kmeans: 20
        search_configs: &flat_k10
          - name: k=10
            params:
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128]
              k: [10]
              config:
                - {name: "", num_rerank: 0}
      - build_name: flat_256
        build_params: { <<: *flat_defaults, k_per_level: 256 }
        search_configs: *flat_k10
      - build_name: flat_512
        build_params: { <<: *flat_defaults, k_per_level: 512 }
        search_configs: *flat_k10
      - build_name: flat_1024
        build_params: { <<: *flat_defaults, k_per_level: 1024 }
        search_configs: *flat_k10
      - build_name: flat_2048
        build_params: { <<: *flat_defaults, k_per_level: 2048 }
        search_configs: *flat_k10
      - build_name: flat_4096
        build_params: { <<: *flat_defaults, k_per_level: 4096 }
        search_configs: *flat_k10
