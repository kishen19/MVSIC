name: "MVIVF_Flat Ablation (build)"

datasets:
  - name: nq500k
    path: data/beir/nq500k
    index_dir: experiments/mvivf_ablation/indices/nq500k
  - name: fiqa
    path: data/beir/fiqa
    index_dir: experiments/mvivf_ablation/indices/fiqa

indices:
  - name: mvivf_flat
    metric: ip
    build_configs:
      - name: flat_128
        params: &flat_defaults
          k_per_level: 128
          niters: 5
          max_point_clouds_per_cluster: 100
          max_points_per_centroid_inner_kmeans: 20
      - name: flat_256
        params: { <<: *flat_defaults, k_per_level: 256 }
      - name: flat_512
        params: { <<: *flat_defaults, k_per_level: 512 }
      - name: flat_1024
        params: { <<: *flat_defaults, k_per_level: 1024 }
      - name: flat_2048
        params: { <<: *flat_defaults, k_per_level: 2048 }
      - name: flat_4096
        params: { <<: *flat_defaults, k_per_level: 4096 }
