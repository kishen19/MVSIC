name: "MVIVF Ablation (search, stage 1: k_per_level)"

datasets:
  - name: arguana
    path: data/beir/arguana
    index_dir: results/mvivf_ablation/indices/arguana
    results_dir: experiments/mvivf_ablation/results/arguana/stage1
  - name: fiqa
    path: data/beir/fiqa
    index_dir:   results/mvivf_ablation/indices/fiqa
    results_dir: experiments/mvivf_ablation/results/fiqa/stage1
  - name: hotpotqa
    path: data/beir/hotpotqa
    index_dir:   results/mvivf_ablation/indices/hotpotqa
    results_dir: experiments/mvivf_ablation/results/hotpotqa/stage1
  - name: nfcorpus
    path: data/beir/nfcorpus
    index_dir:   results/mvivf_ablation/indices/nfcorpus
    results_dir: experiments/mvivf_ablation/results/nfcorpus/stage1
  - name: nq
    path: data/beir/nq
    index_dir:   results/mvivf_ablation/indices/nq
    results_dir: experiments/mvivf_ablation/results/nq/stage1
  - name: nq500k
    path: data/beir/nq500k
    index_dir:   results/mvivf_ablation/indices/nq500k
    results_dir: experiments/mvivf_ablation/results/nq500k/stage1
  - name: quora
    path: data/beir/quora
    index_dir:   results/mvivf_ablation/indices/quora
    results_dir: experiments/mvivf_ablation/results/quora/stage1
  - name: scidocs
    path: data/beir/scidocs
    index_dir:   results/mvivf_ablation/indices/scidocs
    results_dir: experiments/mvivf_ablation/results/scidocs/stage1
  - name: scifact
    path: data/beir/scifact
    index_dir:   results/mvivf_ablation/indices/scifact
    results_dir: experiments/mvivf_ablation/results/scifact/stage1

indices:
  - name: mvivf
    metric: ip
    builds:
      - build_name: mvivf_k0_l500
        build_params: &stage1_defaults
          k_per_level: 0
          max_leaf_size: 500
          max_depth: 0
          niters: 5
          max_point_clouds_per_cluster: 100
          max_points_per_centroid_inner_kmeans: 20
          build_with_8btq: true
        # variants omitted => single raw variant (IndexMVIVFIP).
        # To ablate center-compression / leaf-quantization, add e.g.:
        # variants:
        #   - {name: "",         compress: false, quantizer: None}
        #   - {name: compress,   compress: true,  quantizer: None}
        #   - {name: pq,         compress: false, quantizer: PQ}
        #   - {name: compress_pq, compress: true, quantizer: PQ}
        search_configs: &ivf_k10
          - name: k=10
            params:
              tq8_rerank: [true]
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
              k: [10]
              config:
                - {name: "", num_rerank: 0}
      - build_name: mvivf_k4_l500
        build_params: { <<: *stage1_defaults, k_per_level: 4 }
        search_configs: *ivf_k10
      - build_name: mvivf_k8_l500
        build_params: { <<: *stage1_defaults, k_per_level: 8 }
        search_configs: *ivf_k10
      - build_name: mvivf_k16_l500
        build_params: { <<: *stage1_defaults, k_per_level: 16 }
        search_configs: *ivf_k10
      - build_name: mvivf_k32_l500
        build_params: { <<: *stage1_defaults, k_per_level: 32 }
        search_configs: *ivf_k10
