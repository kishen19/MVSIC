name: "MVIVF Ablation (search, stage 2: max_leaf_size)"

datasets:
  # - name: nq500k
  #   path: data/beir/nq500k
  #   index_dir:   results/mvivf_ablations/indices/nq500k
  #   results_dir: experiments/mvivf_ablations/results/nq500k
  - name: fiqa
    path: data/beir/fiqa
    index_dir:   results/mvivf_ablations/indices/fiqa
    results_dir: experiments/mvivf_ablations/results/fiqa

indices:
  - name: mvivf
    metric: ip
    builds:
      - build_name: mvivf_k0_l10_d0
        build_params: &stage2_defaults
          k_per_level: 0
          max_leaf_size: 10
          max_depth: 0
          niters: 5
          max_point_clouds_per_cluster: 100
          max_points_per_centroid_inner_kmeans: 20
        search_configs: &ivf_k10
          - name: k=10
            params:
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
              k: [10]
              config:
                - {name: "", num_rerank: 0}
      - build_name: mvivf_k0_l50_d0
        build_params: { <<: *stage2_defaults, max_leaf_size: 50 }
        search_configs: *ivf_k10
      - build_name: mvivf_k0_l100_d0
        build_params: { <<: *stage2_defaults, max_leaf_size: 100 }
        search_configs: *ivf_k10
      - build_name: mvivf_k0_l500_d0
        build_params: { <<: *stage2_defaults, max_leaf_size: 500 }
        search_configs: *ivf_k10
      - build_name: mvivf_k0_l1000_d0
        build_params: { <<: *stage2_defaults, max_leaf_size: 1000 }
        search_configs: *ivf_k10

