name: "MVIVF Ablation (search, stage 2: max_leaf_size)"

datasets:
  - name: nq
    path: data/beir/nq
    index_dir:   results/mvivf_ablation/indices/nq
    results_dir: experiments/mvivf_ablation/results/nq/stage2
  - name: nq500k
    path: data/beir/nq500k
    index_dir:   results/mvivf_ablation/indices/nq500k
    results_dir: experiments/mvivf_ablation/results/nq500k/stage2
  - name: fiqa
    path: data/beir/fiqa
    index_dir:   results/mvivf_ablation/indices/fiqa
    results_dir: experiments/mvivf_ablation/results/fiqa/stage2
  - name: arguana
    path: data/beir/arguana
    index_dir:   results/mvivf_ablation/indices/arguana
    results_dir: experiments/mvivf_ablation/results/arguana/stage2

indices:
  - name: mvivf
    metric: ip
    builds:
      - build_name: mvivf_k0_l50_d0
        build_params: &stage2_defaults
          k_per_level: 0
          max_leaf_size: 50
          max_depth: 0
          niters: 5
          max_point_clouds_per_cluster: 100
          max_points_per_centroid_inner_kmeans: 20
          build_with_8btq: true
        search_configs: &ivf_k10
          - name: k=10
            params:
              tq8_rerank: [true]
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
              k: [10]
              config:
                - {name: "", num_rerank: 0}
      - build_name: mvivf_k0_l100_d0
        build_params: { <<: *stage2_defaults, max_leaf_size: 100 }
        search_configs: *ivf_k10
      - build_name: mvivf_k0_l500_d0
        build_params: { <<: *stage2_defaults, max_leaf_size: 500 }
        search_configs: *ivf_k10
      - build_name: mvivf_k0_l1000_d0
        build_params: { <<: *stage2_defaults, max_leaf_size: 1000 }
        search_configs: *ivf_k10

