name: "MVIVF_Spill Ablation (build)"

# Runs on top of the MVIVF Stage-6 winner; replace `k_per_level`, `max_leaf_size`,
# `max_depth`, `niters`, `mpcc`, `mpcik` with those winning values before running.

datasets:
  - name: nq500k
    path: data/beir/nq500k
    index_dir: experiments/mvivf_ablation/indices/nq500k
  - name: fiqa
    path: data/beir/fiqa
    index_dir: experiments/mvivf_ablation/indices/fiqa

indices:
  - name: mvivf_spill
    metric: ip
    build_configs:
      - name: spill_s2
        params: &spill_defaults
          k_per_level: 16        # UPDATE: MVIVF stage-1 winner
          max_leaf_size: 500     # UPDATE: MVIVF stage-3 winner
          max_depth: 0           # UPDATE: MVIVF stage-2 winner
          niters: 5
          max_point_clouds_per_cluster: 100
          max_points_per_centroid_inner_kmeans: 20
          num_spill: 2
      - name: spill_s4
        params: { <<: *spill_defaults, num_spill: 4 }
      - name: spill_s8
        params: { <<: *spill_defaults, num_spill: 8 }
