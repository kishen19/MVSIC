name: "MVIVF Ablation (build, stage 4: niters)"

datasets:
  - name: arguana
    path: data/beir/arguana
    index_dir: results/mvivf_ablation/indices/arguana
    is_mmap: true
  - name: fiqa
    path: data/beir/fiqa
    index_dir: results/mvivf_ablation/indices/fiqa
    is_mmap: true
  - name: hotpotqa
    path: data/beir/hotpotqa
    index_dir: results/mvivf_ablation/indices/hotpotqa
    is_mmap: true
  - name: nfcorpus
    path: data/beir/nfcorpus
    index_dir: results/mvivf_ablation/indices/nfcorpus
    is_mmap: true
  - name: nq
    path: data/beir/nq
    index_dir: results/mvivf_ablation/indices/nq
    is_mmap: true
  - name: nq500k
    path: data/beir/nq500k
    index_dir: results/mvivf_ablation/indices/nq500k
    is_mmap: true
  - name: quora
    path: data/beir/quora
    index_dir: results/mvivf_ablation/indices/quora
    is_mmap: true
  - name: scidocs
    path: data/beir/scidocs
    index_dir: results/mvivf_ablation/indices/scidocs
    is_mmap: true
  - name: scifact
    path: data/beir/scifact
    index_dir: results/mvivf_ablation/indices/scifact
    is_mmap: true

indices:
  - name: mvivf
    metric: ip
    build_configs:
      # Stage-1 winner fixed: k_per_level = 0.
      # Stage-2 winner fixed: max_leaf_size = 100 for small, 500 for large.
      # Stage-3 winner fixed: max_depth = 0.
      - name: mvivf_k0_l500_d15_nit0_s0_mpcc100
        params: &stage4_defaults
          verbose: 2
          k_per_level: 0
          max_leaf_size: 500
          max_depth: 15
          niters: 0
          s: 0
          max_point_clouds_per_cluster: 100
          max_points_per_centroid_inner_kmeans: 20
          build_with_8btq: true
      - name: mvivf_k0_l500_d15_nit5_s0_mpcc100
        params: { <<: *stage4_defaults, niters: 5 }
      - name: mvivf_k0_l500_d15_nit10_s0_mpcc100
        params: { <<: *stage4_defaults, niters: 10 }
