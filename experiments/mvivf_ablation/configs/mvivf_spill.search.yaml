name: "MVIVF_Spill Ablation (search)"

datasets:
  - name: nq500k
    path: data/beir/nq500k
    index_dir:   experiments/mvivf_ablation/indices/nq500k
    results_dir: experiments/mvivf_ablation/results/nq500k
  - name: fiqa
    path: data/beir/fiqa
    index_dir:   experiments/mvivf_ablation/indices/fiqa
    results_dir: experiments/mvivf_ablation/results/fiqa

indices:
  - name: mvivf_spill
    metric: ip
    builds:
      - build_name: spill_s2
        build_params: &spill_defaults
          k_per_level: 16
          max_leaf_size: 500
          max_depth: 0
          niters: 5
          max_point_clouds_per_cluster: 100
          max_points_per_centroid_inner_kmeans: 20
          build_with_8btq: true
          num_spill: 2
        search_configs: &ivf_spill_k10
          - name: k=10
            params:
              tq8_rerank: [true]
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
              k: [10]
              config:
                - {name: "", num_rerank: 0}
      - build_name: spill_s4
        build_params: { <<: *spill_defaults, num_spill: 4 }
        search_configs: *ivf_spill_k10
      - build_name: spill_s8
        build_params: { <<: *spill_defaults, num_spill: 8 }
        search_configs: *ivf_spill_k10
