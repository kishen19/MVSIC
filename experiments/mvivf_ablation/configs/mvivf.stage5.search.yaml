name: "MVIVF Ablation (search, stage 5: num_spill)"

# Stage 5 sweeps `num_spill` for the level-1 spill tree against the base mvivf
# baseline (treated as num_spill = 1). Search-time params are otherwise frozen
# at their stage-1..stage-4 winners. Group plots by `num_spill` (mvivf rows
# get num_spill = 1 synthetically).

datasets:
  - name: arguana
    path: data/beir/arguana
    index_dir:   results/mvivf_ablation/indices/arguana
    results_dir: experiments/mvivf_ablation/results/arguana/stage5
    is_mmap: true
  - name: fiqa
    path: data/beir/fiqa
    index_dir:   results/mvivf_ablation/indices/fiqa
    results_dir: experiments/mvivf_ablation/results/fiqa/stage5
    is_mmap: true
  - name: hotpotqa
    path: data/beir/hotpotqa
    index_dir:   results/mvivf_ablation/indices/hotpotqa
    results_dir: experiments/mvivf_ablation/results/hotpotqa/stage5
    is_mmap: true
  - name: nfcorpus
    path: data/beir/nfcorpus
    index_dir:   results/mvivf_ablation/indices/nfcorpus
    results_dir: experiments/mvivf_ablation/results/nfcorpus/stage5
    is_mmap: true
  - name: nq
    path: data/beir/nq
    index_dir:   results/mvivf_ablation/indices/nq
    results_dir: experiments/mvivf_ablation/results/nq/stage5
    is_mmap: true
  - name: nq500k
    path: data/beir/nq500k
    index_dir:   results/mvivf_ablation/indices/nq500k
    results_dir: experiments/mvivf_ablation/results/nq500k/stage5
    is_mmap: true
  - name: quora
    path: data/beir/quora
    index_dir:   results/mvivf_ablation/indices/quora
    results_dir: experiments/mvivf_ablation/results/quora/stage5
    is_mmap: true
  - name: scidocs
    path: data/beir/scidocs
    index_dir:   results/mvivf_ablation/indices/scidocs
    results_dir: experiments/mvivf_ablation/results/scidocs/stage5
    is_mmap: true
  - name: scifact
    path: data/beir/scifact
    index_dir:   results/mvivf_ablation/indices/scifact
    results_dir: experiments/mvivf_ablation/results/scifact/stage5
    is_mmap: true

indices:
  - name: mvivf_spill
    metric: ip
    builds:
      - build_name: mvivf_k0_l100_d0_nit5_s0_mpcc100_spill_4_1
        build_params: &spill_defaults
          k_per_level: 0
          max_leaf_size: 100
          max_depth: 0
          niters: 5
          max_point_clouds_per_cluster: 100
          max_points_per_centroid_inner_kmeans: 20
          build_with_8btq: true
          num_spill: 4
          num_spill_l2: 1
        search_configs: &ivf_spill_k10
          - name: k=10
            params:
              tq8_rerank: [true]
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
              k: [10]
              config:
                - {name: "", num_rerank: 0}
      - build_name: mvivf_k0_l100_d0_nit5_s0_mpcc100_spill_2_1
        build_params: { <<: *spill_defaults, num_spill: 2 }
        search_configs: *ivf_spill_k10
  - name: mvivf
    metric: ip
    builds:
      - build_name: mvivf_k0_l100_d0_nit5_s0_mpcc100
        build_params:
          k_per_level: 0
          max_leaf_size: 100
          max_depth: 0
          niters: 5
          max_point_clouds_per_cluster: 100
          max_points_per_centroid_inner_kmeans: 20
          build_with_8btq: true
        search_configs:
          - name: k=10
            params:
              tq8_rerank: [true]
              nprobes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
              k: [10]
              config:
                - {name: "", num_rerank: 0}
