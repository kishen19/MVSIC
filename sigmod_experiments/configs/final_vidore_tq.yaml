name: "Final Experiments - ViDoRe Collection (TurboQuant)"

datasets:
  - name: docvqa
    path: data/vidore/docvqa
    results: results/final/vidore/docvqa
  - name: infovqa
    path: data/vidore/infovqa
    results: results/final/vidore/infovqa
  - name: tatdqa
    path: data/vidore/tatdqa
    results: results/final/vidore/tatdqa
  - name: arxivqa
    path: data/vidore/arxivqa
    results: results/final/vidore/arxivqa
  - name: tabfquad
    path: data/vidore/tabfquad
    results: results/final/vidore/tabfquad
  - name: chartqa
    path: data/vidore/chartqa
    results: results/final/vidore/chartqa

indices:
  - name: muvera
    build_configs:
      - name: muvera_2560_tq
        params:
          verbose: 1
          d_fde: 2560
          pq_method: 4
        search_configs:
          - name: k=10
            params: &L_tq
              L: [16, 32, 64, 128, 256, 512, 1024]
              k: [10]
              config:
                - {name: "nr10", num_rerank: 10, norerank: True}
                - {name: "nr20", num_rerank: 20}
                - {name: "nr50", num_rerank: 50}
                - {name: "nr100", num_rerank: 100}

  - name: vamana
    build_configs:
      - name: vamana_R200_tq
        params:
          verbose: 1
          R: 200
          pq_method: 4
        search_configs:
          - name: k=10
            params:
              <<: *L_tq
              config:
                - {name: "nr10", num_rerank: 0}
                - {name: "nr20", num_rerank: 20}
                - {name: "nr50", num_rerank: 50}

  - name: svh_graph
    build_configs:
      - name: svh_graph_R200_tq
        params:
          verbose: 1
          R: 200
          pq_method: 4
        search_configs:
          - name: k=10
            params:
              <<: *L_tq
              config:
                - {name: "nr10", num_rerank: 10, norerank: True}
                - {name: "nr50", num_rerank: 50}
                - {name: "nr500", num_rerank: 500}
