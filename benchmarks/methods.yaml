# This file defines schema and metadata for each indexing method.
#
# Top-level fields per method:
#   class:             C++/pybind class-name stem after `Index`
#                      (e.g. "MVIVF" -> IndexMVIVFIP / IndexMVIVFL2 / ...)
#   variable_param:    sweep axis used by plotting tooling
#   labels:            ordered list of timer/stat labels returned by
#                      search_with_stats
#   supports_compress: true iff the family exposes a `CompressCenters=true`
#                      templated variant (IndexXxxCompress...).  Only MVIVF
#                      family + SVH_IVF today.
#   quantizers:        list of leaf-quantizer names the family accepts in
#                      `variants[].quantizer`.  "None" is always supported.
#
# Quantizer names (shared vocabulary, case-insensitive):
#   None, PQ, FastScan, RaBitQ, TQ (aka TurboQuant, 4-bit), SPQTQ,
#   OneBitTQ (1-bit TQ), EightBitTQ (8-bit TQ).
#   OneBitTQ / EightBitTQ currently require the multi-vector (_mv) quantizer
#   family, so they are only listed for MVIVF / Vamana at the moment.
#
# The actual compile-time class resolution lives in benchmark_search.py
# (`_resolve_class`).  This file is the single source of truth for which
# combinations are expected to exist in the pybind module.

mvivf:
  variable_param: nprobes
  class: "MVIVF"
  supports_compress: true
  quantizers: [None, PQ, FastScan, RaBitQ, TQ, SPQTQ, OneBitTQ, EightBitTQ]
  # Order matches IndexMVIVF::search_with_stats (mvivf.h): greedy stats[0..4],
  # then compress / quantize / leaf dists / sort / rerank / greedy wall.
  labels:
    [
      "search_cmps",
      "probe_cmps",
      "t_search_dists",
      "t_search_beam",
      "t_search_rest",
      "t_search_top_level",
      "t_compress",
      "t_quant",
      "t_leaf_dists",
      "t_leaf_rest",
      "t_rerank",
      "t_greedy",
    ]

mvivf_flat:
  variable_param: nprobes
  class: "MVIVFFlat"
  supports_compress: true
  quantizers: [None, PQ, FastScan, RaBitQ, TQ, SPQTQ, OneBitTQ, EightBitTQ]
  # Order matches IndexMVIVFFlat::search_with_stats (mvivf_flat.h).
  labels:
    ["search_L", "search_cmps", "t_compress", "t_search", "t_leaf_dists", "t_leaf_rest", "t_rerank"]

mvivf_spill:
  variable_param: nprobes
  class: "MVIVFSpill"
  supports_compress: true
  quantizers: [None, PQ, FastScan, RaBitQ, TQ, SPQTQ, OneBitTQ, EightBitTQ]
  # Order matches IndexMVIVFSpill::search_with_stats (mvivf_spill.h).
  # Spill's greedy returns 4-element gs.stats (no t_top_level), so this list
  # has 11 entries — one fewer than the regular mvivf block above.
  labels:
    [
      "search_cmps",
      "probe_cmps",
      "t_search_dists",
      "t_search_beam",
      "t_search_rest",
      "t_compress",
      "t_quant",
      "t_leaf_dists",
      "t_leaf_dedup",
      "t_leaf_rest",
      "t_rerank",
    ]

muvera:
  variable_param: L
  class: "MUVERA"
  supports_compress: false
  quantizers: [None, PQ, FastScan, RaBitQ, TQ, SPQTQ, OneBitTQ]
  # Order matches IndexMUVERA::search_with_stats (muvera.h).
  labels: ["search_cmps", "t_compress", "t_fde", "t_quant", "t_search", "t_rerank"]

mpool:
  variable_param: L
  class: "MPool"
  supports_compress: false
  quantizers: [None, PQ, FastScan, RaBitQ, TQ, SPQTQ]
  # Order matches IndexMPool::search_with_stats (mpool.h). No dist_cmps scalar.
  labels: ["t_compress", "t_mean_pooling", "t_quant", "t_search", "t_rerank"]

vamana:
  variable_param: L
  class: "Vamana"
  supports_compress: false
  quantizers: [None, PQ, FastScan, RaBitQ, TQ, SPQTQ, OneBitTQ, EightBitTQ]
  # Order matches IndexVamana::search_with_stats (vamana.h).
  labels: ["search_cmps", "t_compress", "t_quant", "t_search", "t_rerank"]

svh_ivf:
  variable_param: nprobes
  class: "SVHIVF"
  supports_compress: true
  quantizers: [None, PQ, FastScan, RaBitQ, TQ, SPQTQ]
  # Order matches IndexSVHIVF::search_with_stats (svh_ivf.h): total dist_cmps,
  # then top-level timings, then per-search_each columns summed over query vectors.
  labels:
    [
      "search_cmps",
      "t_compress",
      "t_search_each_total",
      "t_merge_dedup",
      "t_rerank",
      "search_each_cmps",
      "t_each_search_dists",
      "t_each_search_beam",
      "t_each_search_rest",
      "t_each_quant",
      "t_each_leaf_dists",
      "t_each_leaf_rest",
      "t_each_dedup",
    ]

svh_graph:
  variable_param: L
  class: "SVHGraph"
  supports_compress: false
  quantizers: [None, PQ, FastScan, RaBitQ, TQ, SPQTQ]
  labels: ["search_cmps", "t_compress", "t_graph_search", "t_aggregate", "t_rerank"]

fastplaid:
  variable_param: n_ivf_probe
  class: "FastPlaid"
  supports_compress: false
  quantizers: [None]
  labels: ["t_batch_search"]

igp:
  variable_param: nprobe
  class: "IGP"
  supports_compress: false
  quantizers: [None]
  labels: ["t_retrieval", "t_filter", "t_decode", "t_refine"]

gem:
  # GEM (SIGMOD'26 multi-vector retrieval) -- graph-on-IVF hybrid built via
  # an external C++ runner (//benchmarks/gem:gem_runner). Search-side
  # sweeps `ef_search`; the per-result-budget knob is `rerank_k` (which the
  # `nrXXX` filename convention encodes, matching other methods'
  # num_rerank). `nprobe` is the per-token coarse-cluster filter (paper t).
  variable_param: ef_search
  class: "GEM"
  supports_compress: false
  quantizers: [None]
  labels: ["t_filter", "t_graph_search", "t_rerank"]

hnswlib:
  # Upstream nmslib/hnswlib flat token HNSW + chamfer-IP rerank baseline.
  # Built/searched via //benchmarks/hnswlib:hnswlib_runner (subprocess).
  variable_param: ef_search
  class: "Hnswlib"
  supports_compress: false
  quantizers: [None]
  labels: ["t_graph_search", "t_rerank"]
