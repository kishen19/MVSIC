# This file defines schema and metadata for each indexing method.

mvivf:
  variable_param: nprobes
  class: "MVIVF" 
  labels: ["search_cmps", "t_search_dists", "t_search_beam", "t_search_rest", "t_quant", "t_leaf_dists", "t_leaf_rest", "t_rerank"]

mvivf_flat:
  variable_param: nprobes
  class: "MVIVFFlat" 

mvivf_spill:
  variable_param: nprobes
  class: "MVIVFSpill" 
  labels: ["search_cmps", "t_search_dists", "t_search_beam", "t_search_rest", "t_quant", "t_leaf_dists", "t_leaf_dedup", "t_leaf_rest", "t_rerank"]

muvera:
  variable_param: L
  class: "MUVERA"

mpool:
  variable_param: L
  class: "MPool"

vamana:
  variable_param: L
  class: "Vamana"

svh_ivf:
  variable_param: nprobes
  class: "SVHIVF"

fastplaid:
  variable_param: n_ivf_probe
  class: "FastPlaid"
